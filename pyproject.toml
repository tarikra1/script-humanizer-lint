[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "script-humanizer-lint"
version = "1.0.0"
description = "Deterministic spoken-script linter catching LLM writing clichés, em-dash overuse, and breath-heavy sentences in video voiceovers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Tarik", email = "tarikra1@users.noreply.github.com" }
]
keywords = ["copywriting", "voiceover", "linter", "llm-evaluation", "video-scripts", "nlp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tarikra1/script-humanizer-lint"
Repository = "https://github.com/tarikra1/script-humanizer-lint"
Changelog = "https://github.com/tarikra1/script-humanizer-lint/blob/main/CHANGELOG.md"
Issues = "https://github.com/tarikra1/script-humanizer-lint/issues"

[project.scripts]
script-humanizer = "script_humanizer_lint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
